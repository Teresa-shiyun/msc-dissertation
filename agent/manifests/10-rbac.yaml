apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestration-agent
  namespace: tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestration-agent
  namespace: workload
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestration-agent
  namespace: workload
subjects:
  - kind: ServiceAccount
    name: orchestration-agent
    namespace: tools
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchestration-agent
