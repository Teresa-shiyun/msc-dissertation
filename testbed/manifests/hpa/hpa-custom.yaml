apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workload-cloud-rps
  namespace: workload
  labels:
    arm: B
    variant: rps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workload-cloud
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Pods
      pods:
        metric:
          name: workload_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
