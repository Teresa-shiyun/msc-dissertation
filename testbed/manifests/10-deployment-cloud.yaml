apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-cloud
  namespace: workload
  labels:
    app: workload
    tier: cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload
      tier: cloud
  template:
    metadata:
      labels:
        app: workload
        tier: cloud
    spec:
      nodeSelector:
        tier: cloud
      containers:
        - name: workload
          image: workload:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TIER
              value: cloud
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
