apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-edge
  namespace: workload
  labels:
    app: workload
    tier: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload
      tier: edge
  template:
    metadata:
      labels:
        app: workload
        tier: edge
    spec:
      nodeSelector:
        tier: edge
      containers:
        - name: workload
          image: workload:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TIER
              value: edge
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
