kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cloud-edge
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    labels:
      tier: cloud
      topology.kubernetes.io/zone: cloud-zone
  - role: worker
    labels:
      tier: edge
      topology.kubernetes.io/zone: edge-zone
