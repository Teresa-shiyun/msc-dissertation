prometheus:
  url: http://kube-prom-stack-prometheus.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    - seriesQuery: 'workload_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^(.*)_total$"
        as: "${1}_per_second"
      metricsQuery: |
        sum by (<<.GroupBy>>) (
          rate(<<.Series>>{<<.LabelMatchers>>}[1m])
        )

    - seriesQuery: 'workload_request_duration_seconds_bucket{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^(.*)_bucket$"
        as: "${1}_p95_ms"
      metricsQuery: |
        histogram_quantile(
          0.95,
          sum by (<<.GroupBy>>, le) (
            rate(<<.Series>>{<<.LabelMatchers>>}[2m])
          )
        ) * 1000
